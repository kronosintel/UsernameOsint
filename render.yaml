services:
  - type: web
    name: username-search-osint
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT usernamesearchosint:app
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: COOKIE_SECURE
        value: "1"
      - key: MAX_WORKERS
        value: "4"
      - key: REQUEST_TIMEOUT
        value: "8"
      - key: CONSULTA_TIMEOUT
        value: "35"
      - key: MAIGRET_ALL_SITES
        value: "0"
      - key: MAIGRET_TIMEOUT
        value: "45"
      - key: MAIGRET_ENABLED
        value: "0"
      - key: CANAL_PRINCIPAL_ID
        sync: false
      - key: GRUPO_LOGS_ID
        sync: false
      - key: CONSULTA_PRECO
        value: "5.90"
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: PAGAMENTO_EXPIRACAO_MINUTOS
        value: "30"
      - key: ADMIN_BYPASS_PAYMENT
        value: "1"
      - key: HIBP_API_KEY
        sync: false
      - key: VT_API_KEY
        sync: false
      - key: PLACA_API_URL
        sync: false
      - key: PLACA_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
